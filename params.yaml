
experiment:
  name: atm-cash-prediction

data:
  target_column: withdrawal_thousand_rs
  test_size: 0.2
  random_state: 42


model:
  type: random_forest
  configurations:
    - name: rf_100_depth10
      n_estimators: 100
      max_depth: 10
      min_samples_split: 2

    - name: rf_200_depth10
      n_estimators: 200
      max_depth: 10
      min_samples_split: 2

    - name: rf_100_depth15
      n_estimators: 100
      max_depth: 15
      min_samples_split: 2

tracking:
  uri: sqlite:///mlflow.db
  registered_model_name: atm-cash-prediction
